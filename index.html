<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algebra - Wormate.io</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #111424;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 5px;
            color: #ff6b6b;
            text-shadow: 0 0 10px rgba(255,107,107,0.4);
        }
        p {
            font-size: 1.1rem;
            color: #a0a5c0;
            margin-bottom: 30px;
            max-width: 400px;
        }
        .play-btn {
            background: linear-gradient(135deg, #ff6b6b, #ff8e53);
            color: white;
            padding: 18px 45px;
            font-size: 1.4rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
            transition: transform 0.1s, box-shadow 0.2s;
        }
        .play-btn:active {
            transform: scale(0.96);
            box-shadow: 0 2px 10px rgba(255, 107, 107, 0.2);
        }
    </style>
</head>
<body>

    <h1>Algebra Hub</h1>
    <p>Eat sweets, grow your giant worm, and dominate the leaderboard in Wormate.io!</p>
    
    <!-- Direct shortcut button to launch the game -->
    <a href="https://wormate.io/" class="play-btn">Play Wormate.io 🍰🐛</a>

</body>
</html>
